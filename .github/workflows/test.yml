name: test

# The tests run against Xymon built here -- its main branch, and its latest
# release, 4.3.31, the oldest the plugins accept: the API reads what a real
# xymond answers, so that is what it is tested with, and a release has no
# XYMONRUNDIR, which main has. The weekly run catches a change in Xymon that
# breaks the API when nothing here changed.
#
# A push runs them on the integration branches alone -- main, and dev on a
# fork that has one -- and a pull request runs them on its head: a branch
# pushed with a pull request open used to run them twice, once for each.
on:
  push:
    branches: [main, dev]
  pull_request:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        xymon: [main, rel-4.3.31]
        modules: [newest]
        # The search's three tests, half the time of the others together,
        # run beside them, in a job of their own, on each Xymon.
        suite: [core, rag]
        # The oldest modules xymonapi's requirements.txt asks, exactly
        # those: the versions written there are the ones its tests pass
        # with, so that an install may refuse an older one (SPEC, S26).
        include:
          - xymon: main
            modules: floors
            suite: core
    steps:
      - name: Checkout xymon-plugins
        uses: actions/checkout@v7
        with:
          path: plugins-repo

      # The commit the branch or tag names, read before anything is
      # fetched: Xymon built at that commit is cached, and a hit skips
      # both the checkout and the build. The tree is cached whole -- a
      # fresh checkout's files would be newer than the cached objects, and
      # make would build everything again.
      - name: Xymon's commit
        id: xymon
        env:
          REF: ${{ matrix.xymon }}
        run: |
          refs=$(git ls-remote https://github.com/xymon-monitoring/xymon "refs/heads/$REF" "refs/tags/$REF" "refs/tags/$REF^{}")
          sha=$(printf '%s\n' "$refs" | awk '$2 ~ /\^\{\}$/ { peeled = $1 } { first = first ? first : $1 } END { print peeled ? peeled : first }')
          [ -n "$sha" ] || { echo "no $REF in xymon-monitoring/xymon" >&2; exit 1; }
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Cache Xymon, built
        id: xymon-built
        uses: actions/cache@v6
        with:
          path: xymon
          key: xymon-built-${{ runner.os }}-${{ steps.xymon.outputs.sha }}-${{ hashFiles('plugins-repo/.github/workflows/test.yml') }}

      - name: Checkout Xymon (${{ matrix.xymon }})
        if: steps.xymon-built.outputs.cache-hit != 'true'
        uses: actions/checkout@v7
        with:
          repository: xymon-monitoring/xymon
          ref: ${{ steps.xymon.outputs.sha }}
          path: xymon

      # The floors are old: a Python their wheels exist for.
      - name: A Python the oldest modules install on
        if: matrix.modules == 'floors'
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      # The virtualenv, kept from run to run per Python and modules: the
      # install below then only upgrades what has a newer release, which
      # newest still means (--upgrade-strategy eager), and adds nothing for
      # floors, whose versions are exact.
      - name: Python's version
        id: python
        run: echo "version=$(python3 -c 'import sys; print(sys.version.split()[0])')" >> "$GITHUB_OUTPUT"

      - name: Cache the virtualenv
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/venv
          key: venv-${{ runner.os }}-${{ steps.python.outputs.version }}-${{ matrix.modules }}-${{ hashFiles('plugins-repo/plugins/*/requirements.txt') }}

      - name: Install dependencies
        id: deps
        env:
          MODULES: ${{ matrix.modules }}
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential libc-ares-dev libldap-dev libpcre2-dev \
            librrd-dev libssl-dev libtirpc-dev \
            rrdtool apache2-utils openssl curl python3 python3-venv
          # The system Python takes no pip installs (PEP 668); the launcher
          # uses whichever Python XYMONAPI_PYTHON names.
          [ -x "$RUNNER_TEMP/venv/bin/python3" ] || python3 -m venv "$RUNNER_TEMP/venv"
          if [ "$MODULES" = floors ]; then
            sed -e 's/>=/==/' plugins-repo/plugins/xymonapi/requirements.txt > "$RUNNER_TEMP/floors.txt"
            cat "$RUNNER_TEMP/floors.txt"
            "$RUNNER_TEMP/venv/bin/pip" install -r "$RUNNER_TEMP/floors.txt"
          else
            "$RUNNER_TEMP/venv/bin/pip" install --upgrade --upgrade-strategy eager \
              -r plugins-repo/plugins/xymonapi/requirements.txt -r plugins-repo/plugins/xymonapi-rag/requirements.txt
          fi
          # The search's modules as installed, for its caches' keys: its
          # requirements give only floors.
          echo "rag=$("$RUNNER_TEMP/venv/bin/pip" freeze | { grep -iE '^(fastembed|numpy|onnxruntime)==' || true; } | sort | paste -sd- -)" >> "$GITHUB_OUTPUT"
          # And the model it embeds with by default, for the model's cache.
          echo "model=$(sed -n 's|^MODEL = os.environ.get("XYMONAPI_RAG_MODEL", "\(.*\)")$|\1|p' plugins-repo/plugins/xymonapi-rag/xymonrag.py | tr / -)" >> "$GITHUB_OUTPUT"

      # The non-interactive configure recipe of Xymon's own build.yml.
      - name: Build Xymon
        if: steps.xymon-built.outputs.cache-hit != 'true'
        working-directory: xymon
        run: |
          USEXYMONPING=y ENABLESSL=y ENABLELDAP=y ENABLELDAPSSL=y \
          XYMONUSER=xymon XYMONTOPDIR=/usr/lib/xymon XYMONVAR=/var/lib/xymon \
          XYMONHOSTURL=/xymon CGIDIR=/usr/lib/xymon/cgi-bin XYMONCGIURL=/xymon-cgi \
          SECURECGIDIR=/usr/lib/xymon/cgi-secure SECUREXYMONCGIURL=/xymon-seccgi \
          HTTPDGID=www-data XYMONLOGDIR=/var/log/xymon \
          XYMONHOSTNAME=localhost XYMONHOSTIP=127.0.0.1 MANROOT=/usr/share/man \
          INSTALLBINDIR=/usr/lib/xymon/server/bin INSTALLETCDIR=/etc/xymon \
          INSTALLWEBDIR=/etc/xymon/web INSTALLEXTDIR=/usr/lib/xymon/server/ext \
          INSTALLTMPDIR=/var/lib/xymon/tmp INSTALLWWWDIR=/var/lib/xymon/www \
          ./configure --server
          make -j"$(nproc)"

      # The search's embedding model, downloaded otherwise at each run: one
      # per model and per version of the modules installed.
      - name: Cache the search's model
        if: matrix.suite == 'rag'
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/fastembed
          key: rag-model-${{ runner.os }}-${{ steps.deps.outputs.model }}-${{ steps.deps.outputs.rag }}

      # The index of every Xymon manual page the eval test builds, nearly
      # four minutes of CPU. An index keeps the vectors of the passages it
      # holds and embeds only new ones. One per Xymon branch, whose pages
      # differ, and per Xymon commit: a newer commit starts from the index
      # of an older one (restore-keys), embeds the pages that changed, and
      # is saved under its own key -- with the commit left out, a key once
      # saved was never saved again, and every run embedded the changes
      # anew. A change to how passages are cut or embedded, or to the
      # modules installed, changes the prefix, and the index is built
      # afresh. Saved by a run on main, read by pull requests.
      - name: Cache the search's index
        if: matrix.suite == 'rag'
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/rag-eval
          key: rag-index-${{ matrix.xymon }}-${{ steps.deps.outputs.rag }}-${{ hashFiles('plugins-repo/plugins/xymonapi-rag/xymonrag.py') }}-${{ steps.xymon.outputs.sha }}
          restore-keys: rag-index-${{ matrix.xymon }}-${{ steps.deps.outputs.rag }}-${{ hashFiles('plugins-repo/plugins/xymonapi-rag/xymonrag.py') }}-

      - name: Test
        env:
          XYMON_SRC: ${{ github.workspace }}/xymon
          XYMONAPI_PYTHON: ${{ runner.temp }}/venv/bin/python3
          XYMONAPI_NO_SKIP: "1"
          FASTEMBED_CACHE_PATH: ${{ runner.temp }}/fastembed
          XYMONAPI_RAG_EVAL_INDEX: ${{ runner.temp }}/rag-eval/docs.npz
          MODULES: ${{ matrix.modules }}
          SUITE: ${{ matrix.suite }}
        run: |
          # With the oldest modules, xymonapi's own tests: the search's
          # modules are not among them. Otherwise the search's tests in
          # their job, one after the other (xymonapi-rag.sh reads the index
          # the eval test leaves), and every other directory in the other,
          # four at once, one per CPU of the runner.
          if [ "$MODULES" = floors ]; then
            plugins-repo/tests/run.sh -j4 plugins/xymonapi/tests
          elif [ "$SUITE" = rag ]; then
            plugins-repo/tests/run.sh plugins/xymonapi-rag/tests
          else
            set --
            for d in plugins-repo/plugins/*/tests; do
              d=${d#plugins-repo/}
              [ "$d" = plugins/xymonapi-rag/tests ] || set -- "$@" "$d"
            done
            plugins-repo/tests/run.sh -j4 "$@" tests/compat
          fi

  # The API's contract changes only with its version: build/contract-check.sh
  # compares it with stable's, oasdiff saying which changes break clients.
  # oasdiff is fetched pinned, and checked against its published checksum.
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      OASDIFF_VERSION: "1.35.0"
      OASDIFF_SHA256: a8023002fcb2eaa7f5758148a9303cb63d33b939886df312268bc0fc7b939140
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Fetch oasdiff
        run: |
          f=oasdiff_${OASDIFF_VERSION}_linux_amd64.tar.gz
          curl -sSfL -o "$RUNNER_TEMP/$f" "https://github.com/oasdiff/oasdiff/releases/download/v$OASDIFF_VERSION/$f"
          echo "$OASDIFF_SHA256  $RUNNER_TEMP/$f" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$f" -C "$RUNNER_TEMP" oasdiff

      - name: The contract and its version
        run: |
          git fetch -q origin stable || true
          OASDIFF="$RUNNER_TEMP/oasdiff" build/contract-check.sh origin/stable | tee -a "$GITHUB_STEP_SUMMARY"

  # bash 3.2, macOS's /bin/sh, refuses constructs every later shell takes --
  # a case pattern with no "(" inside $( ), for one -- so a script that runs
  # on Linux could not even start on a Mac. Built here from GNU's 3.2.57,
  # its parser made anew by bison as Apple's is (the y.tab.c in the archive
  # predates the 57 patches), and cached: no macOS runner to wait for. What
  # running on macOS checks beyond parsing -- BSD tools, paths -- is the
  # Mac run's before a change to the installer is merged (docs/PLAN.md).
  bash32-sh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Cache bash 3.2.57
        id: bash32
        uses: actions/cache@v6
        with:
          path: ~/bash32
          key: bash-3.2.57-3fa9daf85ebf35068f090ce51283ddeeb3c75eb5bc70b1a4a7cb05868bfe06a4-${{ runner.os }}
      - name: Build bash 3.2.57
        if: steps.bash32.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends bison
          cd "$RUNNER_TEMP"
          curl -fsSLO https://ftp.gnu.org/gnu/bash/bash-3.2.57.tar.gz
          echo "3fa9daf85ebf35068f090ce51283ddeeb3c75eb5bc70b1a4a7cb05868bfe06a4  bash-3.2.57.tar.gz" | sha256sum -c
          tar -xzf bash-3.2.57.tar.gz
          cd bash-3.2.57
          # gnu89 and no warnings: C of 2007, which later compilers refuse otherwise.
          ./configure --without-bash-malloc --disable-nls CFLAGS='-O1 -std=gnu89 -w' >/dev/null
          make -j"$(nproc)" >/dev/null
          mkdir -p ~/bash32 && cp bash ~/bash32/bash
      - name: Parse the scripts with bash 3.2, as macOS's /bin/sh
        run: |
          # Invoked as sh, as on macOS: bash in its POSIX mode.
          ln -sf ~/bash32/bash "$RUNNER_TEMP/sh"; sh32=$RUNNER_TEMP/sh
          "$sh32" --version | head -n 1
          # The check checks itself: a bash that took this would pass
          # everything, and catch nothing.
          printf 'x=$(case a in a) echo y ;; esac)\n' > "$RUNNER_TEMP/bad.sh"
          if "$sh32" -n "$RUNNER_TEMP/bad.sh" 2>/dev/null; then
            echo "::error::this bash 3.2 parses a case with no ( inside \$( ), which macOS's /bin/sh refuses"; exit 1
          fi
          for f in xymon-plugin build/*.sh plugins/*/*.sh; do
            "$sh32" -n "$f" || { echo "::error file=$f::bash 3.2 (macOS's /bin/sh) cannot parse $f"; rc=1; }
          done
          exit "${rc:-0}"

  # stable: the newest commit of main every check passed, which outside users
  # install. Moved forward only, never back nor forced; a run that finishes
  # after a newer one leaves it where it is.
  stable:
    needs: [test, contract, bash32-sh]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # One at a time: two pushes a minute apart start two runs, and the
    # second's job fetched stable, found it behind, and pushed after the
    # first had moved it -- rejected, "cannot lock ref", and stable left
    # behind the newer green commit. Queued instead, each sees what the one
    # before it did; none is cancelled, since the ancestor checks below
    # already make a late run a no-op.
    concurrency:
      group: stable
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Move stable to this commit [S11]
        run: |
          if git fetch -q origin stable; then
            if git merge-base --is-ancestor "$GITHUB_SHA" origin/stable; then
              echo "stable already holds $GITHUB_SHA"; exit 0
            fi
            git merge-base --is-ancestor origin/stable "$GITHUB_SHA" \
              || { echo "[S11] stable is not behind $GITHUB_SHA: left as it is" >&2; exit 1; }
          fi
          git push origin "$GITHUB_SHA:refs/heads/stable"
